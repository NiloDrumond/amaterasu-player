[tasks.default]
description = "List all available tasks"
run = "mise tasks"

[tasks."dev:web"]
description = "Start web development environment"
run = """
cd apps/web && bun run dev
"""

[tasks."dev:server"]
description = "Start server development environment"
run = """
cd apps/server && cargo run
"""

# The format after the test is to format the ts-rs generated bindings
[tasks."test"]
description = "Run backend tests and generate type bindings"
depends = ["lint"]
run = '''
cargo test -- --show-output
cd apps/web && bun format
bun run test
'''

[tasks.format]
description = "Format code"
run = '''
cargo fmt
cd apps/web && bun run format
cd ../server && sqruff fix
'''

[tasks.check]
description = "Run cargo check, clippy, and frontend type/lint checks"
run = """
cargo check
cargo clippy
cd apps/web && bun run check && bun run lint
"""

[tasks.lint]
description = "Check that all Serialize/Deserialize structs have rename_all"
run = "cargo run --release -p dto-lint --quiet"

[tasks."db:up"]
description = "Start infrastructure services"
run = "docker compose -f infra/docker-compose.yml up"

[tasks."db:down"]
description = "Stop all docker services"
run = "docker compose -f infra/docker-compose.yml down"

[tasks."db:drop"]
description = "Stop services and remove volumes"
run = "docker compose -f infra/docker-compose.yml down -v"

[tasks."db:migrate"]
description = "Run database migrations"
run = "sqlx migrate run"
dir = "apps/server"

[tasks."db:revert"]
description = "Revert database migration"
run = "sqlx migrate revert"
dir = "apps/server"

[tasks."search:clean"]
description = "Remove the on-disk Tantivy search index"
dir = "apps/server"
run = """
set -a && . ./.env && set +a && rm -rf "$DATA_DIR/search-index"
"""

[tasks.clean]
description = "Clean everything (docker volumes + cargo + search index)"
depends = ["db:drop", "search:clean"]
run = """
cd apps/server && cargo clean
"""
