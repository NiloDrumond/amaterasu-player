worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 16m;

    # SvelteKit SSR can emit large response headers (e.g. several Set-Cookie on
    # authenticated requests). The default 4k/8k proxy header buffer overflows
    # and nginx returns 502 ("upstream sent too big header"), so bump it.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preserve the scheme from an upstream TLS-terminating proxy (e.g. Caddy);
    # fall back to our own scheme for direct access. Lets the app know whether
    # the original request was HTTPS (used for the Secure cookie flag).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream api {
        server 127.0.0.1:8080;
    }

    upstream web {
        server 127.0.0.1:3001;
    }

    server {
        listen 3000;
        listen [::]:3000;

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
        }

        location /health {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        location /admin/logs {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
