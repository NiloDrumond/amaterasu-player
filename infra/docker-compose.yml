services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amaterasu
      POSTGRES_USER: amaterasu
      POSTGRES_PASSWORD: amaterasu
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amaterasu"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - amaterasu-network

