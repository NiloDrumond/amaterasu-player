services:
  amaterasu:
    image: nilodrumond/amaterasu-player:latest
    ports:
      - "${PORT:-4534}:3000"
    environment:
      DATABASE_URL: postgres://amaterasu:${POSTGRES_PASSWORD}@db:5432/amaterasu
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MUSICBRAINZ_ENABLED: ${MUSICBRAINZ_ENABLED:-false}
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:-}
    volumes:
      - data:/data
      - ${MUSIC_PATH}:/music:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amaterasu
      POSTGRES_USER: amaterasu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amaterasu"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  data:
  db_data:
