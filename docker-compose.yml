services:
  amaterasu:
    build: .
    # Or use a pre-built image:
    # image: ghcr.io/nilodrumond/amaterasu-player:latest
    ports:
      - "4534:3000"
    environment:
      DATABASE_URL: postgres://amaterasu:amaterasu@db:5432/amaterasu
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: changeme
      # MUSICBRAINZ_ENABLED: true
      # MUSICBRAINZ_USER_AGENT: "amaterasu/1.0 ( mailto:you@example.com )"
    volumes:
      - data:/data
      - /path/to/your/music:/music:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amaterasu
      POSTGRES_USER: amaterasu
      POSTGRES_PASSWORD: amaterasu
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amaterasu"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  data:
  db_data:
