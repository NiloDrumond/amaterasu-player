[package]
name = "amaterasu-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
governor = "0.10"
tower_governor = { version = "0.8", features = ["axum", "tracing"] }

# Auth
argon2 = "0.5"
ipnet = { version = "2", features = ["serde"] }
rand = "0.10"

# Database
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "ipnet",
  "migrate",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
hex = "0.4"
ts-rs = { version = "12", features = [
  'serde-compat',
  'chrono-impl',
  'uuid-impl',
] }

# Validation
garde = { version = "0.22", features = ["derive", "email", "url", "regex"] }
axum-valid = { version = "0.24.0", default-features = false, features = [
  "garde",
  "basic",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-loki = "0.2"
url = "2"

# Outbound HTTP: Grafana proxy + MusicBrainz/CAA clients
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

# Config
dotenvy = "0.15"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
infer = "0.19.0"

# Library Scanning
ffmpeg-next = "8.1"
walkdir = "2"

# Search
tantivy = "0.26"

# Macros
amaterasu-macros = { path = "../../libs/macros" }
ron = "0.12.0"
base64 = "0.22.1"

[dev-dependencies]
wiremock = "0.6"
